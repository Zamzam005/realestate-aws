<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RealEstate — property and vehicles across Somalia</title>
  <meta name="description" content="Browse property and vehicles for sale in Somalia, with live listings and direct buyer contact." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
  <div class="ledger" id="ledger" aria-live="polite">

  <header class="masthead">
    <a class="brand" href="/" data-route="/" aria-label="RealEstate home">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">RealEstate</span>
    </a>

    <nav class="masthead__nav" aria-label="Main navigation">
      <a href="/" data-route="/">Home</a>
      <a href="/property" data-route="/property">Property</a>
      <a href="/cars" data-route="/cars">Cars</a>

      <a href="/contact" data-route="/contact">Contact</a>
    </nav>

  <main id="app" aria-live="polite"></main>

  <footer style="max-width: 1200px; margin: 0 auto; padding: 1rem var(--pad, 1rem) 2rem; border-top: 1px solid rgba(10, 38, 34, 0.18); color: rgba(10, 38, 34, 0.7);">
    <p><strong>Phone:</strong> <a href="tel:+252615550142">+252 61 555 0142</a></p>
    <p><strong>Email:</strong> <a href="mailto:info@realestate.so">info@realestate.so</a></p>
    <p><strong>Office:</strong> Hodan District, Mogadishu, Somalia</p>
  </footer>

  <div id="lightbox" class="lightbox" hidden aria-hidden="true"></div>

  <script src="/app.js"></script>
</body>
</html>
